name: Bug report
description: Report reproducible unexpected behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include source data, access tokens, or other sensitive material."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands, sanitized input, and resulting output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or 1234abc"
    validations:
      required: true
